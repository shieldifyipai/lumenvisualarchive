<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Amber Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Lens Glass Radial Gradient -->
    <radialGradient id="lensGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="30%" stop-color="#27272a" />
      <stop offset="70%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Lens Flare Reflection -->
    <linearGradient id="reflectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Golden Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.35" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Camera Body Group -->
  <g filter="url(#softGlow)">
    <!-- Top Left Shutter Button -->
    <rect x="140" y="112" width="44" height="22" rx="7" fill="#52525b" />
    <rect x="146" y="102" width="32" height="14" rx="4" fill="url(#amberGrad)" />

    <!-- Center Viewfinder / Prism Top -->
    <path d="M 216 134 L 238 106 C 242 101 249 98 256 98 C 263 98 270 101 274 106 L 296 134 Z" fill="#27272a" stroke="#3f3f46" stroke-width="4" stroke-linejoin="round" />

    <!-- Main Camera Chassis -->
    <rect x="84" y="134" width="344" height="232" rx="42" fill="#18181b" stroke="#3f3f46" stroke-width="6" />

    <!-- Top Metallic Plate -->
    <path d="M 84 176 C 84 152.8 102.8 134 126 134 L 386 134 C 409.2 134 428 152.8 428 176 L 428 198 L 84 198 Z" fill="#27272a" />
    <line x1="84" y1="198" x2="428" y2="198" stroke="#09090b" stroke-width="4" />

    <!-- Viewfinder Window (Glass) -->
    <rect x="120" y="152" width="38" height="26" rx="6" fill="#09090b" stroke="#52525b" stroke-width="3" />
    <rect x="124" y="156" width="30" height="18" rx="4" fill="#38bdf8" opacity="0.35" />

    <!-- Golden Sensor Accent Dot (Leica style) -->
    <circle cx="376" cy="165" r="12" fill="url(#amberGrad)" />
    <circle cx="376" cy="165" r="4.5" fill="#ffffff" opacity="0.75" />

    <!-- Lens Outer Barrel -->
    <circle cx="256" cy="264" r="88" fill="#09090b" stroke="#3f3f46" stroke-width="6" />
    
    <!-- Outer Metal Aperture Bezel -->
    <circle cx="256" cy="264" r="76" fill="#18181b" stroke="url(#amberGrad)" stroke-width="6" />

    <!-- Lens Optical Glass Element -->
    <circle cx="256" cy="264" r="62" fill="url(#lensGrad)" />

    <!-- Concentric Aperture Guide Ring -->
    <circle cx="256" cy="264" r="42" fill="none" stroke="#52525b" stroke-width="3" stroke-dasharray="14 6" opacity="0.85" />

    <!-- Center Sensor Reflection & Iris Golden Glow -->
    <circle cx="256" cy="264" r="20" fill="url(#amberGrad)" />
    <circle cx="256" cy="264" r="9" fill="#ffffff" />

    <!-- Lens Curved Optical Reflection Flare -->
    <path d="M 210 228 A 58 58 0 0 1 296 220 A 50 50 0 0 0 222 258 Z" fill="url(#reflectionGrad)" />
  </g>
</svg>
